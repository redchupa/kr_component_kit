blueprint:
  name: 🏠 집 떠날 때 버스 시간 알림
  description: >
    핸드폰(device_tracker)이 **zone.home 을 떠나는 순간** 다음 버스 도착 시간을
    알림 액션으로 보냅니다.

    서울버스 / 한국 버스 양쪽 모두 동작.
  domain: automation
  source_url: https://github.com/redchupa/kr_component_kit/blob/main/blueprints/automation/kr_component_kit/leaving_home_alert.yaml
  input:
    person_or_tracker:
      name: 추적할 디바이스
      description: 본인 폰의 person 또는 device_tracker entity
      selector:
        entity:
          domain:
            - person
            - device_tracker
    home_zone:
      name: 집 zone
      default: zone.home
      selector:
        entity:
          domain: zone
    bus_sensor:
      name: 버스 도착 sensor (slot 0)
      selector:
        entity:
          domain: sensor
          device_class: timestamp
    notify_action:
      name: 알림 액션
      default:
        - service: notify.notify
          data:
            title: "{{ alert_title }}"
            message: "{{ alert_message }}"
      selector:
        action:

variables:
  bus_sensor: !input bus_sensor

trigger:
  - platform: state
    entity_id: !input person_or_tracker
    from: home

action:
  - variables:
      alert_title: "🚌 다음 버스"
      alert_message: >-
        {{ state_attr(bus_sensor, 'friendly_name') or bus_sensor }} —
        {% set v = states(bus_sensor) %}
        {% if v in ['unknown', 'unavailable', 'none', None] %}
          (도착정보 없음)
          {% set msg = state_attr(bus_sensor, 'message') %}
          {% if msg %} {{ msg }}{% endif %}
        {% else %}
          {% set delta = ((as_datetime(v) - now()).total_seconds() / 60) | round(0) %}
          약 {{ delta }}분 후 도착.
          {% set msg = state_attr(bus_sensor, 'message') %}
          {% if msg %} ({{ msg }}){% endif %}
        {% endif %}
  - choose: []
    default: !input notify_action

mode: single
max_exceeded: silent
