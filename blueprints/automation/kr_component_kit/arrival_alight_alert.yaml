blueprint:
  name: 📍 목적지 도착 시 하차 알람 (위치 기반)
  description: >
    핸드폰(device_tracker)이 **목적지 zone 에 진입하는 순간** 알림 액션을 실행.
    버스 안에서 잠들었어도 폰 위치로 깨움 — 일반 버스앱이 못 하는 강점.

    > 💡 목적지 zone 만들기: 설정 → 영역 → 추가 → 회사/학교 좌표 + 반경 200~300m.

    서울버스 / 한국 버스 무관하게 작동 (위치 기반이라 sensor 자체에 의존 안 함).
  domain: automation
  source_url: https://github.com/redchupa/kr_component_kit/blob/main/blueprints/automation/kr_component_kit/arrival_alight_alert.yaml
  input:
    person_or_tracker:
      name: 추적할 디바이스
      selector:
        entity:
          domain:
            - person
            - device_tracker
    destination_zone:
      name: 목적지 zone
      description: 회사/학교/약속장소 zone (반경 200~300m 권장)
      selector:
        entity:
          domain: zone
    extra_message:
      name: 추가 메시지 (옵션)
      default: ""
      selector:
        text:
    notify_action:
      name: 알림 액션
      default:
        - service: notify.notify
          data:
            title: "{{ alert_title }}"
            message: "{{ alert_message }}"
      selector:
        action:

variables:
  destination_zone: !input destination_zone
  extra_message: !input extra_message

trigger:
  - platform: state
    entity_id: !input person_or_tracker
    to: "{{ destination_zone.split('.')[1] }}"

action:
  - variables:
      alert_title: "📍 목적지 도착"
      alert_message: >-
        🚏 {{ state_attr(destination_zone, 'friendly_name') or destination_zone.split('.')[1] }}
        근처에 도착했습니다. 하차 준비하세요!
        {% if extra_message %} {{ extra_message }}{% endif %}
  - choose: []
    default: !input notify_action

mode: single
max_exceeded: silent
