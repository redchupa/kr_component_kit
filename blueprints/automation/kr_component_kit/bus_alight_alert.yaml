blueprint:
  name: 🔔 하차 알람 (탑승 중 목적지 도달)
  description: >
    탑승 중인 버스 sensor 의 `current_stop` attribute 가 **목적지 정류장 이름** 을
    포함하면 알림 액션을 실행합니다. 부분 일치 OK.

    > ⚠️ **이 자동화는 사용자가 직접 enable/disable 하는 것을 가정**.
    > 탑승 시 자동화 ON, 하차 후 OFF 또는 "탑승 중" input_boolean 헬퍼와 결합.

    서울버스 / 한국 버스 양쪽 모두 동작.
  domain: automation
  source_url: https://github.com/redchupa/kr_component_kit/blob/main/blueprints/automation/kr_component_kit/bus_alight_alert.yaml
  input:
    bus_sensor:
      name: 탑승 중인 버스 도착 sensor
      selector:
        entity:
          domain: sensor
          device_class: timestamp
    destination_stop_name:
      name: 목적지 정류장 이름
      description: 부분 일치 OK. 예) "강남역" → "강남역.2호선" 매치.
      selector:
        text:
    notify_action:
      name: 알림 액션
      description: >
        실행할 알림 액션. action 안에서 `{{ alert_title }}` / `{{ alert_message }}` 변수 사용 가능.
      default:
        - service: notify.notify
          data:
            title: "{{ alert_title }}"
            message: "{{ alert_message }}"
      selector:
        action:

variables:
  destination_stop_name: !input destination_stop_name

trigger:
  - platform: state
    entity_id: !input bus_sensor
    attribute: current_stop

condition:
  - condition: template
    value_template: >-
      {% set cur = trigger.to_state.attributes.current_stop | default('') %}
      {{ destination_stop_name and destination_stop_name in cur }}

action:
  - variables:
      alert_title: "🔔 하차 알람"
      alert_message: >-
        🚏 곧 {{ destination_stop_name }} 도착! 하차 준비하세요.
        (현재 정류장: {{ trigger.to_state.attributes.current_stop }})
  - choose: []
    default: !input notify_action

mode: single
max_exceeded: silent
