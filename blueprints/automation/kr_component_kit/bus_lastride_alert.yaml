blueprint:
  name: 🌙 막차 알람
  description: >
    선택한 버스 sensor 의 도착 정보가 **막차** 일 때 알림 액션을 실행.

    서울버스의 `isLast1` 와 한국버스의 `lastVehicle` 양쪽 모두 지원
    (sensor 의 `last_vehicle` / `is_last` attribute 로 노출).
  domain: automation
  source_url: https://github.com/redchupa/kr_component_kit/blob/main/blueprints/automation/kr_component_kit/bus_lastride_alert.yaml
  input:
    bus_sensor:
      name: 버스 도착 sensor (slot 0 권장)
      selector:
        entity:
          domain: sensor
          device_class: timestamp
    notify_action:
      name: 알림 액션
      description: >
        실행할 알림 액션. action 안에서 `{{ alert_title }}` / `{{ alert_message }}` 변수 사용 가능.
      default:
        - service: notify.notify
          data:
            title: "{{ alert_title }}"
            message: "{{ alert_message }}"
      selector:
        action:

variables:
  bus_sensor: !input bus_sensor

trigger:
  - platform: state
    entity_id: !input bus_sensor
    attribute: last_vehicle
    to: "true"
  - platform: state
    entity_id: !input bus_sensor
    attribute: is_last
    to: "1"

action:
  - variables:
      alert_title: "🌙 막차 알람"
      alert_message: >-
        {{ state_attr(bus_sensor, 'friendly_name') or bus_sensor }} —
        🚨 이번 차가 막차입니다!
        {% set v = states(bus_sensor) %}
        {% if v not in ['unknown', 'unavailable', 'none', None] %}
          {% set delta = ((as_datetime(v) - now()).total_seconds() / 60) | round(0) %}
          약 {{ delta }}분 후 도착. 지금 출발하세요.
        {% endif %}
  - choose: []
    default: !input notify_action

mode: single
max_exceeded: silent
